<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKGuessr Ultra - Ultimate Geography Experience</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        cyber: {
                            purple: '#a855f7',
                            pink: '#ec4899',
                            blue: '#3b82f6',
                            cyan: '#06b6d4',
                        }
                    },
                    boxShadow: {
                        'neon-green': '0 0 25px rgba(16, 185, 129, 0.4)',
                        'neon-blue': '0 0 25px rgba(59, 130, 246, 0.4)',
                        'neon-pink': '0 0 25px rgba(236, 72, 153, 0.4)',
                        'neon-purple': '0 0 25px rgba(168, 85, 247, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom glow & pulse animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2.5s infinite;
        }

        .shake-anim {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-hover:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.85);
        }

        /* Gradient Text */
        .gradient-text-cyber {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-text-emerald {
            background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>

                </div>
                <div>
                    <div class="flex items-center gap-2">

                    <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-400"></i>

                <!-- Navigation Home Button -->
                <button id="nav-menu-btn" onclick="showScreen('menu-screen')" class="hidden px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-house"></i>
                    <span>Menu</span>
                </button>

                    <div class="flex flex-col">
                        <span id="player-rank-title" class="text-[10px] text-amber-300 uppercase tracking-wider font-extrabold">Novice Explorer</span>
                        <div class="flex items-center gap-1.5
